<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Detalle de Compra</title>
    <style>
        @page {
            margin: 0.5cm;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

            table.border th, table.border td {
                text-align: center;
                padding: 6px;
                border: 1px solid #000000;
            }

        tr {
            page-break-inside: avoid;
        }
    </style>
</head>
<body>
    <table border="0" style="margin-bottom: 15px;">
        <tr>
            <td style="width:15%; vertical-align: top;"></td>
            <td style="width:60%; vertical-align: top; text-align: center;">
                <table border="0" style="width: 100%; font-size: 11px;">
                    <tr>
                        <td style="text-align: center; font-size: 18px; font-weight: bold; padding-bottom: 4px;">
                            @nombrenegocio
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: center; padding-bottom: 2px;">
                            RUC: @docnegocio
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: center;">
                            Dirección: @direcnegocio
                        </td>
                    </tr>
                </table>
            </td>
            <td style="width:25%; vertical-align: top; text-align: right;">
                <table class="border" style="width: 100%;">
                    <tr>
                        <td style="background-color:#CACACA; font-size:14px; font-weight:bold;">
                            @tipodocumento
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:14px; font-weight:bold;">
                            @numerodocumento
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <hr style="border: 0.5px solid #ccc; margin: 10px 0;" />

    <table border="0" style="font-size: 11px; margin-bottom: 15px;">
        <tr>
            <td style="width:18%; font-weight:bold; padding: 2px 0;">Documento Proveedor:</td>
            <td style="width:32%; padding: 2px 0;">@docproveedor</td>
            <td style="width:18%; font-weight:bold; padding: 2px 0;">Fecha Registro:</td>
            <td style="width:32%; padding: 2px 0;">@fecharegistro</td>
        </tr>
        <tr>
            <td style="font-weight:bold; padding: 2px 0;">Nombre Proveedor:</td>
            <td>@nombreproveedor</td>
            <td style="font-weight:bold; padding: 2px 0;">Usuario Registro:</td>
            <td>@usuarioregistro</td>
        </tr>
    </table>

    <table class="border" style="font-size:11px; margin-bottom: 15px;">
        <thead>
            <tr style="background-color:#CACACA">
                <th style="width: 45%;">Producto</th>
                <th style="width: 20%;">Precio Compra</th>
                <th style="width: 15%;">Cantidad</th>
                <th style="width: 20%;">Sub Total</th>
            </tr>
        </thead>
        <tbody>
            @filas
        </tbody>
    </table>

    <table border="0">
        <tr>
            <td style="width: 75%;"></td>
            <td style="width: 25%;">
                <table class="border" style="font-size:11px;">
                    <thead>
                        <tr style="background-color:#CACACA">
                            <th>Monto Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: bold;">@montototal</td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
